<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ruby lane repro — spike vs .vr/.vc</title>
<style>
  :root { --cell: 28px; --lane: 16.8px; --pitch: 44.8px; }
  body { font-family: "Noto Serif JP", "Yu Mincho", serif; margin: 0;
         display: flex; gap: 40px; padding: 20px; }
  .box {
    writing-mode: vertical-rl;
    height: 300px;
    font-size: var(--cell);
    line-height: var(--pitch);
    letter-spacing: 0;
    font-variant-east-asian: full-width;
    text-spacing-trim: space-all;
    text-align: start;
    border: 1px solid #888;
    background-image:
      repeating-linear-gradient(to left,
        rgba(120,140,160,.18) 0, rgba(120,140,160,.18) 1px,
        transparent 1px, transparent calc(var(--lane) / 2),
        rgba(120,140,160,.45) calc(var(--lane) / 2),
        rgba(120,140,160,.45) calc(var(--lane) / 2 + 1px),
        transparent calc(var(--lane) / 2 + 1px), transparent var(--pitch)),
      repeating-linear-gradient(to bottom,
        rgba(120,140,160,.45) 0, rgba(120,140,160,.45) 1px,
        transparent 1px, transparent var(--cell));
    background-position: top right;
  }
  rt { font-size: 52%; }
  .vc { display: inline-block; inline-size: 1em; text-align: center; }
  .vr { display: inline-block; text-align: center; }
  .out { font: 12px/1.5 monospace; white-space: pre; }
</style>
</head>
<body>
<div class="box" id="bare">緑華は<ruby>緑華<rt>りょくか</rt></ruby>と読む。止まない雨。</div>
<div class="box" id="wrapped">緑華は<span class="vr" style="inline-size:2em"><ruby><span class="vc">緑</span><span class="vc">華</span><rt>りょくか</rt></ruby></span>と読む。止まない雨。</div>
<div class="box" id="wrapped-lh1">緑華は<span class="vr" style="inline-size:2em"><ruby><span class="vc">緑</span><span class="vc">華</span><rt style="line-height:1">りょくか</rt></ruby></span>と読む。止まない雨。</div>
<div class="box" id="vr-lh1">緑華は<span class="vr" style="inline-size:2em;line-height:1"><ruby><span class="vc">緑</span><span class="vc">華</span><rt>りょくか</rt></ruby></span>と読む。止まない雨。</div>
<div class="box" id="vc-lh1">緑華は<span class="vr" style="inline-size:2em"><ruby><span class="vc" style="line-height:1">緑</span><span class="vc" style="line-height:1">華</span><rt>りょくか</rt></ruby></span>と読む。止まない雨。</div>
<div class="box" id="both-lh1">緑華は<span class="vr" style="inline-size:2em;line-height:1"><ruby><span class="vc">緑</span><span class="vc">華</span><rt style="line-height:1">りょくか</rt></ruby></span>と読む。止まない雨。</div>
<div class="box" id="fs40">緑華は<span class="vr" style="inline-size:2em;line-height:1"><ruby><span class="vc">緑</span><span class="vc">華</span><rt style="font-size:40%">りょくか</rt></ruby></span>と読む。止まない雨。</div>
<div class="box" id="fs45">緑華は<span class="vr" style="inline-size:2em;line-height:1"><ruby><span class="vc">緑</span><span class="vc">華</span><rt style="font-size:45%">りょくか</rt></ruby></span>と読む。止まない雨。</div>
<div class="box" id="fs50">緑華は<span class="vr" style="inline-size:2em;line-height:1"><ruby><span class="vc">緑</span><span class="vc">華</span><rt style="font-size:50%">りょくか</rt></ruby></span>と読む。止まない雨。</div>
<div class="box" id="bare40">緑華は<ruby>緑華<rt style="font-size:40%">りょくか</rt></ruby>と読む。止まない雨。</div>
<div class="out" id="out"></div>
<script>
function dump(id) {
  const box = document.getElementById(id);
  const lines = ['=== ' + id + ' ==='];
  lines.push('box ' + JSON.stringify(box.getBoundingClientRect()));
  for (const el of box.querySelectorAll('.vr, ruby, .vc, rt')) {
    const r = el.getBoundingClientRect();
    lines.push(
      el.tagName.toLowerCase() + (el.className ? '.' + el.className : '') +
      ' x=' + r.x.toFixed(2) + ' y=' + r.y.toFixed(2) +
      ' w=' + r.width.toFixed(2) + ' h=' + r.height.toFixed(2));
  }
  return lines.join('\n');
}
document.getElementById('out').textContent =
  ['bare','wrapped','wrapped-lh1','vr-lh1','vc-lh1','both-lh1',
   'fs40','fs45','fs50','bare40'].map(dump).join('\n');
</script>
</body>
</html>
