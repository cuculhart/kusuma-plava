<!doctype html>
<meta charset="utf-8">
<style>
  :root { --fs: 19.843px; }
  .ki-obj {
    box-sizing: border-box;
    border: 1px solid rgba(90,110,140,.4);
    width: 642.52px; height: 404.41px;
    overflow: hidden; position: relative;
  }
  .ta {
    width:100%; height:100%;
    box-sizing: border-box;
    padding: 3.7795px;
    font-size: var(--fs);
    line-height: 1.4;
    font-family: 'Yu Mincho','Hiragino Mincho ProN',serif;
    position: relative; color: #222;
  }
  .ta.fix { margin: -1px; width: calc(100% + 2px); height: calc(100% + 2px); }
  .ta-slice { width:100%; height:100%; overflow:hidden; white-space:pre-wrap; overflow-wrap:break-word; }
  .ta-slice.vt { writing-mode: vertical-rl; font-variant-east-asian: full-width;
    letter-spacing: 0; text-align: start; line-height: var(--pitch); }
</style>
<div class="ki-obj"><div class="ta"><div class="ta-slice vt" id="s1" style="--cell:19.843px;--lane:11.906px;--pitch:31.749px"></div></div></div>
<div class="ki-obj"><div class="ta fix"><div class="ta-slice vt" id="s2" style="--cell:19.843px;--lane:11.906px;--pitch:31.749px"></div></div></div>
<div id="out"></div>
<script>
  const chars = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめも';
  let out = '';
  for (const id of ['s1','s2']) {
    const s = document.getElementById(id);
    s.innerHTML = chars.split('').map((c,i)=>`<span data-i="${i}">${c}</span>`).join('');
    const sr = s.getBoundingClientRect();
    out += `${id} slice w=${sr.width.toFixed(2)} h=${sr.height.toFixed(2)}\n`;
    let col = -1, n = 0;
    for (const sp of s.querySelectorAll('span')) {
      const r = sp.getBoundingClientRect();
      const colX = Math.round(r.x);
      if (colX !== col) { if (col>=0) out += `  col@${col}: ${n} chars\n`; col = colX; n = 0; }
      n++;
    }
    if (col>=0) out += `  col@${col}: ${n} chars\n`;
  }
  document.getElementById('out').textContent = out;
</script>
